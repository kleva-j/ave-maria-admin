name: avm-twenty-staging

services:
  server:
    image: twentycrm/twenty:${TAG:-v2.51.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TWENTY_PORT:-3000}:3000"
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    environment: &twenty-environment
      NODE_PORT: 3000
      PG_DATABASE_URL: ${PG_DATABASE_URL:?}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:?}
      APP_SECRET: ${APP_SECRET:?}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    image: twentycrm/twenty:${TAG:-v2.51.0}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
      POSTGRES_USER: ${PG_DATABASE_USER:?}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?}
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-twenty} -d ${PG_DATABASE_NAME:-twenty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://server:3000"]
    depends_on:
      server:
        condition: service_healthy

  ngrok-tunnel:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    restart: unless-stopped
    command: ["http", "--log=stdout", "server:3000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      server:
        condition: service_healthy

volumes:
  twenty-db-data:
  twenty-local-storage:
